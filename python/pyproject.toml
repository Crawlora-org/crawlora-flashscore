[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-flashscore"
version = "0.3.5"
description = "Crawlora Flashscore API client with 54 endpoints for scores, match details, competitions, teams, players, odds, and news"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "flashscore", "flashscore-api", "flashscore-scraper", "flashscore-data", "flashscore-scores", "flashscore-match-details", "flashscore-competitions", "flashscore-teams", "flashscore-players", "flashscore-odds", "flashscore-news"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=flashscore-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=flashscore-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-flashscore"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_flashscore"]

[tool.setuptools.package-data]
"crawlora_flashscore" = ["py.typed", "*.pyi"]
